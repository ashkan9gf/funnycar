name: FunnyCar quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "graphics/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funnycar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Production build
        env:
          DATABASE_URL: "file:../db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

  android-debug-apk:
    name: Build landscape Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools,platforms;android-35,build-tools;35.0.0"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify offline web bundle
        run: bash scripts/build-android-web.sh

      - name: Install Capacitor tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.funnycar.ir",
            "appName": "FunnyCar IR",
            "webDir": "out",
            "bundledWebRuntime": false
          }
          EOF

      - name: Generate native Android project
        run: npx cap add android

      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          marker = 'android:name=".MainActivity"'
          if marker not in manifest:
              raise SystemExit("MainActivity entry not found; refusing to produce a portrait APK")
          if 'android:screenOrientation="landscape"' not in manifest:
              manifest = manifest.replace(marker, marker + '\n            android:screenOrientation="landscape"', 1)
          path.write_text(manifest)
          if 'android:screenOrientation="landscape"' not in path.read_text():
              raise SystemExit("Landscape orientation was not applied")
          PY

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: funnycar-landscape-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
