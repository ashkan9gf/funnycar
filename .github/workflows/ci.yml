name: FunnyCar quality checks

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Production build
        env:
          DATABASE_URL: "file:../db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build
