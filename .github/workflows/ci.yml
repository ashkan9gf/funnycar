name: FunnyCar quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "graphics/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funnycar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: TypeScript, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Production build
        run: bun run build
