name: FunnyCar quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "graphics/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funnycar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Typecheck, lint and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        env:
          DATABASE_URL: "file:../db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

  android-debug-apk:
    name: Build landscape Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Build and verify offline web bundle
        run: bash scripts/build-android-web.sh

      - name: Install Capacitor tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.funnycar.ir",
            "appName": "FunnyCar IR",
            "webDir": "out",
            "bundledWebRuntime": false
          }
          EOF

      - name: Generate native Android project
        run: npx cap add android

      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          marker = 'android:name=".MainActivity"'
          if marker not in manifest:
              raise SystemExit("MainActivity entry not found; refusing to produce a portrait APK")
          if 'android:screenOrientation="landscape"' not in manifest:
              manifest = manifest.replace(marker, marker + '\\n            android:screenOrientation="landscape"', 1)
          path.write_text(manifest)
          if 'android:screenOrientation="landscape"' not in path.read_text():
              raise SystemExit("Landscape orientation was not applied")
          PY

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK and bundled assets
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test -s out/index.html
          test -s out/assets/models/vehicles/player.glb
          GLB_COUNT="$(find out/assets -type f -name '*.glb' -size +0c | wc -l)"
          echo "Bundled GLB models: $GLB_COUNT"
          test "$GLB_COUNT" -ge 1
          APK_BYTES="$(wc -c < "$APK")"
          echo "APK size: $APK_BYTES bytes"
          test "$APK_BYTES" -gt 1000000
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | grep -E "^package:|^application-label:"
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: funnycar-landscape-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
