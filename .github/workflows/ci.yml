name: FunnyCar quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: funnycar-ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Production build
        env:
          DATABASE_URL: "file:../db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Install locked project dependencies
        run: bun install --frozen-lockfile
      - name: Set up Python for vehicle recoloring
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install vehicle recolor tooling
        run: |
          python -m pip install --disable-pip-version-check numpy scipy trimesh pygltflib Pillow pyfqmr xatlas
      - name: Rebuild vehicle models with protected paint boundaries
        run: |
          set -euo pipefail
          for vehicle in player challenger nissan peugeot405 police renault4 samand taxi tiba vintage; do
            echo "Recoloring vehicle: ${vehicle}"
            python scripts/recolor_v5.py "${vehicle}"
          done
          cp public/assets/models/vehicles/player.glb public/assets/models/vehicles/pride.glb
          cp public/assets/models/vehicles/player_lod1.glb public/assets/models/vehicles/pride_lod1.glb
          test -s public/assets/models/vehicles/pride.glb
          test -s public/assets/models/vehicles/pride_lod1.glb
      - name: Build and verify offline web bundle
        run: bash scripts/build-android-web.sh
      - name: Install Capacitor tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync web bundle into Android project
        run: npx cap sync android
      - name: Force landscape orientation for gameplay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          pattern = r'(<activity\b(?=[^>]*android:name="\.MainActivity")[^>]*)(>)'
          s2, count = re.subn(pattern, lambda m: re.sub(r'\s+android:screenOrientation="[^"]*"', '', m.group(1)) + ' android:screenOrientation="landscape"' + m.group(2), s, count=1)
          if count != 1:
              raise SystemExit("Could not locate MainActivity in generated AndroidManifest.xml")
          p.write_text(s2)
          if 'android:screenOrientation="landscape"' not in s2:
              raise SystemExit("Landscape orientation was not applied")
          print("OK: MainActivity locked to landscape orientation")
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: funnycar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
