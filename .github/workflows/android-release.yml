name: FunnyCar signed Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version label (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android versionCode (integer)"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Require release-signing secrets
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for item in SIGNING_KEY KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!item}" ]; then echo "Missing GitHub Actions secret for $item"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure ANDROID_SIGNING_KEY (base64 keystore), ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate source
        run: |
          bun run lint
          bunx tsc --noEmit
      - name: Build offline web bundle
        run: bash scripts/build-android-web.sh
      - name: Install Capacitor tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Set Android version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          if not p.exists():
              p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Cannot locate generated app Gradle file")
          s = p.read_text()
          name = os.environ["VERSION_NAME"]
          code = os.environ["VERSION_CODE"]
          if not code.isdigit() or int(code) < 1:
              raise SystemExit("version_code must be a positive integer")
          if p.suffix == ".kts":
              s, n1 = re.subn(r'versionCode\\s*=\\s*\\d+', f'versionCode = {int(code)}', s, count=1)
              s, n2 = re.subn(r'versionName\\s*=\\s*"[^"]*"', f'versionName = "{name}"', s, count=1)
          else:
              s, n1 = re.subn(r'versionCode\\s+\\d+', f'versionCode {int(code)}', s, count=1)
              s, n2 = re.subn(r'versionName\\s+"[^"]*"', f'versionName "{name}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely update versionCode/versionName")
          p.write_text(s)
          print(f"Release version set to {name} ({code})")
          PY
      - name: Set landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          pattern = r'(<activity\\b(?=[^>]*android:name=".MainActivity")[^>]*)(>)'
          s, count = re.subn(pattern, lambda m: re.sub(r'\\s+android:screenOrientation="[^"]*"', '', m.group(1)) + ' android:screenOrientation="landscape"' + m.group(2), s, count=1)
          if count != 1: raise SystemExit("Could not set MainActivity landscape orientation")
          p.write_text(s)
          PY
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign release APK
        id: sign_app
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: "35.0.0"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: funnycar-signed-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: ${{ steps.sign_app.outputs.signedFile }}
          if-no-files-found: error
          retention-days: 30
